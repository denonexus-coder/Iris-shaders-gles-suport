# This workflow will build a Java project with Gradle
# For more information see: docts/development/brachyura.md

name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # NeoForge ships Sodium as a JarJar, so :neoforge's compile classpath needs both
      # the outer jar and the classes unpacked from META-INF/jarjar. Both paths are
      # declared in build.gradle.kts and gitignored under custom_sodium/.
      - name: Fetch local Sodium (NeoForge) jars
        run: |
          set -euo pipefail
          mkdir -p custom_sodium
          OUTER="custom_sodium/sodium-neoforge-0.8.14+mc1.21.11.jar"
          curl -fsSL --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 180 \
            -A "Iris-shaders-gles-suport/CI" \
            -o "$OUTER" \
            "https://cdn.modrinth.com/data/AANobbMI/versions/sC6wj32u/sodium-neoforge-0.8.14%2Bmc1.21.11.jar"
          echo "949101d0bf301796f89a39d71044736cadd5739b27fabe5ae64be040b10e8cae  $OUTER" | sha256sum -c -
          unzip -o -j -q "$OUTER" 'META-INF/jarjar/*' -d custom_sodium
          rm -f custom_sodium/metadata.json
          NESTED="custom_sodium/net.caffeinemc.sodium-neoforge-0.8.14+mc1.21.11-mod.jar"
          echo "a7f81f0c526795439c581feec0bfcfae607470c108cdf6ea092eb4255dae0632  $NESTED" | sha256sum -c -
          echo "classes: $(unzip -l "$NESTED" | grep -c '\.class') in nested jar"

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: iris-artifacts
          path: |
            build/libs/
            fabric/build/libs/
            neoforge/build/libs/
